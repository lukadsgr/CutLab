# Gera o instalador do CutLab para Windows e publica no GitHub Releases.
# Dispara ao enviar uma tag de versão (ex.: v0.2.0) — a mesma versão de desktop/package.json.
# O programa instalado lê o latest.yml dessa release para avisar que há atualização.
name: Lançar versão desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Conferir versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "A tag ${GITHUB_REF_NAME} não bate com desktop/package.json ($v)"; exit 1; }
      - run: npm ci
      - name: Gerar e publicar o instalador
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
