# Publica o CutLab no GitHub Pages a cada envio para o ramo main.
# Gera cutlab/CutLab.html com o build.mjs e o serve como index.html do site.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite rodar à mão pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# só uma publicação por vez; uma nova cancela a que ainda está na fila
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar CutLab.html
        run: node cutlab/build.mjs
      - name: Montar o site
        run: |
          mkdir -p _site
          cp cutlab/CutLab.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
